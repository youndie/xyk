image:
  repository: ghcr.io/youndie/xyk
  # Empty means "use the chart's appVersion". A moving tag is convenient and a poor thing to deploy:
  # `sha-<commit>` is the only tag here that names something immutable.
  tag: ""
  pullPolicy: IfNotPresent

# THE ENDPOINT AND ITS SECRET ARE NOT SET HERE, and that is the one thing this file refuses to make
# easy. A secret in values.yaml is a secret in the repository and in `helm history`. Point
# `existingSecret` at a Secret you created, with keys `endpointId` and `secret`; leave it empty and
# the service starts with no endpoint at all, which is a fine way to run it and then create endpoints
# through the admin API.
bootstrap:
  existingSecret: ""
  subscribers: ""

config:
  # Payload bodies are purged after this many days. `0` keeps them for ever — see the chart's README
  # and `services/xyk-server.md` on why the default is seven and not zero.
  retentionDays: 7
  # FOUR, AND ON THE MEASURED STAND THAT IS ABOUT ONE INGEST RATE OF CAPACITY. Delivery ran at
  # 54-59 /s against an ingest of the same, which means a queue that builds during an outage does
  # not drain afterwards — two minutes after a five-second outage the queue was still 458 against a
  # healthy 220 (B-31). More workers buy more capacity (B-14 found the curve still linear at eight);
  # what bounds it in a deployment is what the subscribers tolerate, which is not ours to pick.
  deliveryWorkers: 4
  # HOW LONG ONE ATTEMPT MAY TAKE, and against a subscriber that is silent rather than refusing it is
  # also how long a worker is occupied. Four workers at 2 s make about two attempts a second, so a
  # black-holed subscriber backs the queue up at ingest rate whatever the memory limit is
  # (B-31). Lowering it frees workers and gives a slow-but-alive subscriber less time to answer.
  deliveryTimeoutMs: 2000
  # HOW LONG AN OUTAGE MAY LAST BEFORE EVENTS ARE LOST, and that is what this number really sets.
  #
  # The delays between attempts double from one second — 1, 2, 4, 8 — so five attempts span fifteen
  # seconds from the first, and an event whose subscriber has been down for fifteen seconds is
  # `dead`. Measured: nothing dies at a 15-second outage, 90-143 events die at a 20-second one, and
  # about 1 600 die in a minute (B-31). Dead is final — `POST /api/events/{eventId}/redeliver` is by
  # hand, one event at a time, and there is no sweep.
  #
  # Each extra attempt doubles the window: 6 gives ~31 s, 7 ~63 s, 8 ~127 s. It is not free — a
  # failed attempt costs more memory than a delivered one (~14 kB refused, ~60 kB timed out against
  # ~2 kB, B-30/B-31), so raising this raises what an outage spends as well as what it survives.
  deliveryMaxAttempts: 5
  # A HARD CEILING FOR THE GC, in bytes; empty leaves the runtime unbounded.
  #
  # A Kotlin/Native process cannot read its own cgroup limit, so nothing tells the GC what the
  # kernel will kill it for. This is the place that knows the limit, which is why the knob is here —
  # but no run has measured what fraction of a limit should be heap, and a guess trades a kernel
  # kill for an `OutOfMemory`. The measurements used half: `33554432` under a 64Mi limit. Off by
  # default until there is a number.
  heapBytes: ""
  # `0` disables the Stripe timestamp check rather than tightening it.
  stripeToleranceSeconds: 300
  # Quoted out of habit rather than necessity now. It used to be load-bearing: written as a bare
  # integer, Helm parses it as a float and `| quote` rendered `1.048576e+07`, which the service could
  # not read, so it silently used its default and the limit set here did nothing. The template pipes
  # every number through `int64` since, so an override written either way renders the integer — and
  # the config parser refuses to start on an unreadable number rather than falling back. Found by
  # rendering the chart and reading the environment it produces, not by reading the template, which
  # is still the only way to catch this class.
  maxBodyBytes: "10485760"
  publicBaseUrl: ""

persistence:
  # THE DATABASE IS THE ONLY STATE THERE IS. A pod without a volume loses every undelivered event the
  # moment it moves, and the volume is as sensitive as the secrets in it.
  enabled: true
  size: 1Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: 64Mi
    cpu: 100m
  limits:
    # READ THIS AS A TIME BUDGET, NOT AS HEADROOM, IF DELIVERY IS ON.
    #
    # `ktor-client-curl` grows about 2 kB of memory per request and never gives it back. It is not
    # this service's code — the same growth reproduces with one client and no service around it, and
    # the same loop on the CIO engine is flat — and there is nothing to switch to, because curl is
    # the only engine that speaks TLS on Kotlin/Native. It is recorded as a known problem with no
    # fix here: docs/backlog/B-30-delivery-memory-growth.md.
    #
    # So the limit decides how long a pod lives rather than whether it fits. Measured at 60 rps:
    # roughly 90 seconds at 64Mi, four minutes at 128Mi, eight at 256Mi, then an OOM kill and a
    # restart. Nothing is lost in one — an event is committed with its timer before it is answered,
    # and a delivery in flight is retried by whoever takes the lease next — but a deployment that
    # does not expect restarts will see them, and a smaller limit means more of them.
    #
    # AT AN ORDINARY RATE IT ENDS WORSE, NOT BETTER. Soaked at 3 rps under 64Mi for an hour the
    # process is NOT killed: it reaches the limit at about forty minutes, `/health/ready` starts
    # answering 503 at thirty-six, and it then rides the limit — 6 512 delivered of ~10 800 offered,
    # 2 934 still pending at the end. Liveness here is a latch with no checks, so nothing restarts
    # such a pod: Kubernetes takes it out of the endpoints and leaves it running. A lower rate buys
    # minutes rather than immunity, and the failure it buys is the quiet one.
    #
    # The original reason for 128Mi over the measured 64Mi stands on its own: the memory criterion
    # was met by reclaim rather than by headroom, four of ten runs peaking at or above the limit
    # itself, and a service sitting exactly on its limit fails the first time anything changes.
    memory: 128Mi

# terminationGracePeriodSeconds is part of the contract rather than a default: the shutdown plan is
# checked against the number it is told, and the plan's own deadlines sum to less than this.
terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
