#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.enableKlibsCrossCompilation=true
# Measured on katcher rather than taken from a blog: a one-line change through to
# `linkDebugExecutableNative` fell 45.5% (8246 ms -> 4492 ms) over four campaigns on the Linux box,
# with its suite green under it three times. Its effect on CI is NOT measured — a fresh checkout has
# no incremental state to reuse — so that is an expectation here, not a number.
kotlin.incremental.native=true
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# The head of the version, under the name Gradle reads on its own. CI overrides it with -PVERSION.
version=0.1.0

# What this repository tells the shared conventions.
sborka.group=io.github.youndie.xyk
sborka.repository=youndie/xyk
sborka.description=A durable webhook gateway: verify the sender, store before answering, deliver with retries.
sborka.inceptionYear=2026

# Nothing here is published, so this is the JDK the build runs on rather than a floor promised to a
# consumer. It is the portfolio's current one.
sborka.jvmToolchain=25
sborka.jvmFloor=25
