# The code gate: the native link, the image, and the assertion that the process stops in order.
#
# Separate from `check.yaml` (the documents) because it is minutes rather than seconds and needs
# docker. Same rule as there: it runs the target a contributor runs — `make build` — so that the two
# cannot drift apart.
#
# This wraps `make build`, which links the binary, builds the image and asserts the stop order. It is
# minutes rather than seconds, so it is separate from the document gate.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # MANDATORY, NOT AN OPTIMISATION. Without it every run downloads the Kotlin/Native distribution
      # before it can compile a line — minutes, on every push, for bytes that never change within a
      # Kotlin version. The key carries that version for exactly that reason.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - run: make build

      # The size of what would actually be pulled, measured the same way the documents quote it:
      # `docker save`, on one host. `docker image inspect .Size` reports the compressed size on the
      # containerd snapshotter and the uncompressed one on overlay2 — two numbers behind one field,
      # and a runner and a workstation disagree by a factor of three.
      # A BLOCK SCALAR, and not for style. Written as `run: echo "pull bytes: …"` the colon inside
      # the shell string makes YAML read `pull bytes` as a key, the whole file fails to parse, and
      # GitHub reports a run with **zero jobs that fails in zero seconds** — no error, no annotation,
      # and the workflow's name shown as its path. This file had never executed once.
      - name: Image pull bytes
        run: |
          echo "pull bytes: $(docker save xyk:dev | wc -c)"
